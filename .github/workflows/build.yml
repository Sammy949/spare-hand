name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (Release, self-contained, x64)
        run: dotnet publish src/SpareHand/SpareHand.csproj -c Release -r win-x64 --self-contained -p:Platform=x64 -o publish

      - name: Smoke-check the output
        shell: pwsh
        run: |
          if (-not (Test-Path publish/SpareHand.exe)) { throw "SpareHand.exe missing from publish output" }
          "{0:N1} MB published" -f ((Get-ChildItem publish -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: SpareHand-win-x64-${{ github.sha }}
          path: publish/
          retention-days: 14
