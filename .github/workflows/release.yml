name: release

# Two ways to publish a release:
#   - Actions → release → Run workflow, and type a version (e.g. v0.1.0). The tag is created for you.
#   - or push a tag: git tag v0.1.0 && git push origin v0.1.0
# The zip keeps the same name every release, so this link always downloads the newest one:
#   https://github.com/Sammy949/spare-hand/releases/latest/download/SpareHand-win-x64.zip
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$') { throw "Version must look like v0.1.0, got '$env:TAG'" }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Trimmed: 90 MB instead of 168 MB. It passes the same smoke checks as the full build (tools/smoke.sh).
      - name: Publish (Release, self-contained, trimmed, x64)
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v').Split('-')[0]
          dotnet publish src/SpareHand/SpareHand.csproj -c Release -r win-x64 --self-contained -p:Platform=x64 -p:PublishTrimmed=true -p:TrimMode=partial "-p:Version=$version" -o "publish/Spare Hand"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip and checksum
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/Spare Hand/SpareHand.pri")) { throw "SpareHand.pri missing: every window would fail to load" }
          Remove-Item "publish/Spare Hand/*.pdb"
          # One top-level "Spare Hand" folder inside the zip, so unzipping never scatters 300 files.
          Compress-Archive -Path "publish/Spare Hand" -DestinationPath SpareHand-win-x64.zip
          $hash = (Get-FileHash SpareHand-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  SpareHand-win-x64.zip" | Out-File -Encoding ascii SpareHand-win-x64.zip.sha256
          "SHA256: $hash"
          "{0:N1} MB zipped" -f ((Get-Item SpareHand-win-x64.zip).Length / 1MB)

      # Not --prerelease: GitHub's releases/latest link skips pre-releases, and the README download link uses it.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = @"
          **[Download SpareHand-win-x64.zip](https://github.com/Sammy949/spare-hand/releases/latest/download/SpareHand-win-x64.zip)**, unzip, run ``SpareHand.exe`` in the ``Spare Hand`` folder. x64 Windows 11.

          Early build, not code-signed yet: Windows SmartScreen will ask first. Click **More info**, then **Run anyway**. Bugs and ideas: [open an issue](https://github.com/Sammy949/spare-hand/issues/new/choose).
          "@
          gh release create $env:TAG SpareHand-win-x64.zip SpareHand-win-x64.zip.sha256 --target $env:GITHUB_SHA --latest --generate-notes --notes $notes --title "Spare Hand $env:TAG"
