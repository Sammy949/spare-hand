name: release

# Two ways to publish a release:
#   - Actions → release → Run workflow, and type a version (e.g. v0.1.0). The tag is created for you.
#   - or push a tag: git tag v0.1.0 && git push origin v0.1.0
# The installer keeps the same name every release, so this link always downloads the newest one:
#   https://github.com/Sammy949/spare-hand/releases/latest/download/SpareHand-Setup.exe
#   - every push to main runs it as a dry run: the installer is built and uploaded as an artifact, nothing is published.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0-dev') }}
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$') { throw "Version must look like v0.1.0, got '$env:TAG'" }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Trimmed: 90 MB instead of 168 MB. It passes the same smoke checks as the full build (tools/smoke.sh).
      - name: Publish (Release, self-contained, trimmed, x64)
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v').Split('-')[0]
          dotnet publish src/SpareHand/SpareHand.csproj -c Release -r win-x64 --self-contained -p:Platform=x64 -p:PublishTrimmed=true -p:TrimMode=partial "-p:Version=$version" -o "publish/Spare Hand"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The exact Inno Setup build the installer was tested with, checked by hash, unpacked without installing.
      - name: Get Inno Setup 6.7.3
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile innosetup.exe
          $hash = (Get-FileHash innosetup.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw "Inno Setup download doesn't match the tested build: $hash" }
          # WaitForExit, not Start-Process -Wait: in PowerShell 7 -Wait also waits for every child process, and the
          # first CI run hung here for 17 minutes.
          $p = Start-Process innosetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/SP-','/NORESTART','/PORTABLE=1','/CURRENTUSER','/NOICONS',"/DIR=$PWD\inno",'/LOG=inno-setup.log' -PassThru
          if (-not $p.WaitForExit(180000)) { Get-Content inno-setup.log -Tail 30 -ErrorAction SilentlyContinue; throw "Inno Setup didn't finish unpacking in 3 minutes" }
          if (-not (Test-Path inno/ISCC.exe)) { Get-Content inno-setup.log -Tail 30 -ErrorAction SilentlyContinue; throw "ISCC.exe missing after unpacking (exit $($p.ExitCode))" }
          "Inno Setup ready (exit $($p.ExitCode))"

      - name: Build SpareHand-Setup.exe
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/Spare Hand/SpareHand.pri")) { throw "SpareHand.pri missing: every window would fail to load" }
          Remove-Item "publish/Spare Hand/*.pdb"
          $version = $env:TAG.TrimStart('v').Split('-')[0]
          & ./inno/ISCC.exe /Q "/DAppVersion=$version" "/DSourceDir=$PWD\publish\Spare Hand" installer/SpareHand.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item installer/out/SpareHand-Setup.exe .
          $hash = (Get-FileHash SpareHand-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SpareHand-Setup.exe" | Out-File -Encoding ascii SpareHand-Setup.exe.sha256
          "SHA256: $hash"
          "{0:N1} MB" -f ((Get-Item SpareHand-Setup.exe).Length / 1MB)

      - name: Upload installer (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SpareHand-Setup-${{ github.sha }}
          path: SpareHand-Setup.exe
          retention-days: 14

      # Not --prerelease: GitHub's releases/latest link skips pre-releases, and the README download link uses it.
      - name: Create release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = @"
          **[Download SpareHand-Setup.exe](https://github.com/Sammy949/spare-hand/releases/latest/download/SpareHand-Setup.exe)** and run it. No admin rights needed. x64 Windows 11.

          Early build, not code-signed yet: Windows SmartScreen will ask first. Click **More info**, then **Run anyway**. Bugs and ideas: [open an issue](https://github.com/Sammy949/spare-hand/issues/new/choose).
          "@
          gh release create $env:TAG SpareHand-Setup.exe SpareHand-Setup.exe.sha256 --target $env:GITHUB_SHA --latest --generate-notes --notes $notes --title "Spare Hand $env:TAG"
