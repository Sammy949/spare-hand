name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (Release, self-contained, x64)
        run: dotnet publish src/SpareHand/SpareHand.csproj -c Release -r win-x64 --self-contained -p:Platform=x64 -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "SpareHand-${{ github.ref_name }}-win-x64.zip"

      - name: Create release (unsigned build, marked pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "SpareHand-${{ github.ref_name }}-win-x64.zip" --prerelease --generate-notes --title "Spare Hand ${{ github.ref_name }}"
